/* ---------- Data fetch ---------- */
const API = 'https://api.twelvedata.com/time_series';
// Twelve Data verlangt fuer Krypto die Paar-Schreibweise TICKER/USD; encodeURIComponent()
// kodiert den Schraegstrich bereits korrekt als %2F, keine Sonderbehandlung noetig.
function pairSymbol(t){ return t.toUpperCase() + '/USD'; }
// Krypto handelt 7 Tage/Woche ohne Boersensitzung — anders als bei der Aktien-App (NY-Zeit)
// gibt es keine Handelskalender-Frage, nur den UTC-Kalendertag. Twelve Data fuehrt seine
// Krypto-Kerzen ueber Binance in UTC.
function utcToday(){
  return new Date().toISOString().slice(0,10);
}
function dropUnfinished(series){
  if(!closedOnly || !series || !series.length) return series;
  const heute = utcToday();
  return series.filter(v => String(v.d).slice(0,10) < heute);
}
// Referenzdatum fuer "ist ein Coin aktuell?", rein aus der Uhr berechnet statt aus einem
// Benchmark-Abruf: Bei Krypto gibt es keine Feiertage/Wochenenden, die ein Marktkalender-
// Fetch aufloesen muesste (anders als bei der Aktien-App, die dafuer den Benchmark
// immer zuerst und garantiert frisch laden musste). Jeder frische Fetch endet dank
// dropUnfinished exakt auf diesem Datum, also reicht der Vergleich dagegen.
function refDate(){
  if(!closedOnly) return utcToday();
  const d = new Date(); d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}

async function fetchSeries(symbol, key, outputsize){
  const url = `${API}?symbol=${encodeURIComponent(symbol)}&interval=1day&outputsize=${outputsize}&order=ASC&apikey=${encodeURIComponent(key)}`;
  const r = await fetch(url);
  const j = await r.json();
  if(j.status==='error') throw new Error(j.message||'API-Fehler ('+symbol+')');
  if(!j.values) return null;
  return dropUnfinished(j.values.map(v=>({d:v.datetime, c:parseFloat(v.close)})).filter(v=>!isNaN(v.c)));
}

async function refresh(opts={}){
  const key = localStorage.getItem(LS.key);
  if(!key){ openSheet('set'); return; }
  // Immer die volle Historie holen, nicht nur das aktuelle Fenster.
  // Twelve Data rechnet Credits pro Anfrage, nicht pro Zeile — mehr Daten kosten also nichts
  // extra, machen aber jede Fensteränderung zu einer reinen Neuberechnung ohne Neuladen.
  const need = HISTORY;
  const forceAll = opts.force===true;

  const syms = [...new Set(ROWS.filter(r=>r.type==='tk').map(r=>r.ticker))];   // enthaelt BTC

  // Bestehenden Cache laden und weiterverwenden (inkrementell)
  const cached = loadCache() || {};
  const dataMap = Object.assign({}, cached);
  const todayKey = new Date().toISOString().slice(0,10);
  const loadedToday = getLoadedToday(todayKey);

  // Anders als die Aktien-App (Benchmark zuerst, immer frisch, als Nenner fuer alle
  // anderen) braucht es hier keinen separaten ersten Schritt: Jeder Coin — auch BTC selbst
  // — wird im selben inkrementellen Rate-Limit-Lauf als rohe USD-Preisreihe gespeichert.
  // Die RS-Berechnung (vs BTC oder vs USD) passiert erst beim Rendern (applyPct), genau wie
  // Fenstergroesse oder Berechnungsmodus — Referenz umschalten kostet dadurch kein Neuladen.
  const heute = refDate();
  const todo = syms.filter(sym=>{
    if(forceAll) return true;
    const d = dataMap[sym];
    if(!d || !d.c) return true;
    // Massstab ist die Uhr, nicht ein "heute schon geladen"-Merker: Bricht ein Lauf ab,
    // behielten die restlichen Ticker sonst stillschweigend die Kurse vom Vortag und die
    // Anzeige mischte zwei Tage.
    return d.asOf !== heute;
  });

  if(todo.length===0){
    applyPct(dataMap);
    render(dataMap); saveCache(dataMap);
    showStatus('live','Alles aktuell (heute geladen)', new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    toast('Alle Ticker heute schon geladen. „Alles neu laden" im Setup erzwingt Neuladen.');
    return;
  }

  let done=0, failed=[], limitHit=false;
  const RATE_MS = 8100;
  const totalTodo = todo.length;
  await acquireWakeLock();   // iOS pausiert Timer, sobald der Bildschirm ausgeht
  for(const sym of todo){
    showStatus('live', `Lade ${sym} … ${wakeInfo()}`, `${done}/${totalTodo}`);
    try{
      let s = null;
      try{ s = await fetchSeries(pairSymbol(sym), key, need); }
      catch(e1){
        // Manche Coins (oft neuere Meme-/Hype-Token, z.B. WIF, BONK, HYPE) fuehrt Twelve
        // Data nur gegen USDT statt USD. Zweiter Versuch nur im Fehlerfall — kostet bei den
        // ueblichen USD-Paaren keinen Extra-Abruf. Per Test 2026-08-27 verifiziert: WIF,
        // BONK, HYPE, FLOKI, PUMP brauchen diesen Fallback, TON/JUP/PLUME/BEAM/CFG/KCS
        // liefert Twelve Data unter keinem der beiden Paare.
        await sleep(500);
        s = await fetchSeries(sym.toUpperCase()+'/USDT', key, need);
      }
      if(s && s.length>=3){
        const trimmed = s.slice(-HISTORY);
        // Rohe USD-Preisreihe speichern (Datum + Kurs parallel), nicht mehr direkt gegen
        // einen Nenner geteilt — daraus lassen sich beide RS-Modi ohne Neuladen ableiten.
        // Auf sechs signifikante Stellen runden — spart rund die Haelfte des Speichers im
        // Cache, ohne die Rangfolge zu beeinflussen.
        const dates = trimmed.map(v=>v.d);
        const closes = trimmed.map(v=> +v.c.toPrecision(6));
        const last=s.at(-1).c, prev=s.at(-2)?.c;
        // 52-Wochen-Hoch aus den Kursen selbst, nicht aus der RS
        const hi52 = closes.length ? Math.max(...closes) : null;
        const lo52 = closes.length ? Math.min(...closes) : null;
        // Die letzten Schlusskurse mitspeichern, damit die Tages-Kursaenderung denselben
        // Tag meint wie die Tages-RS. Ohne das rechnet die eine im versetzten Fenster
        // und die andere auf dem letzten Kurs — zwei verschiedene Tage nebeneinander.
        dataMap[sym] = {d:dates, c:closes, hi52, lo52, asOf: dates.at(-1), lastDate: dates.at(-1),
                        tail: s.slice(-6).map(v=>v.c),
                        dayChg: prev?((last/prev-1)*100):null, lastClose:last};
        loadedToday[sym] = true;
      }
    }catch(e){
      const msg = (e.message||'').toLowerCase();
      // Twelve Data Limit-Meldungen erkennen
      if(msg.includes('limit') || msg.includes('run out') || msg.includes('credits') || msg.includes('429')){
        limitHit=true; failed.push(sym); break;
      }
      failed.push(sym);
    }
    done++;
    applyPct(dataMap);
    render(dataMap);
    saveCache(dataMap);
    saveLoadedToday(todayKey, loadedToday);
    if(done<totalTodo) await sleep(RATE_MS);
  }
  releaseWakeLock();
  applyPct(dataMap);
  collapseAll();
  saveCache(dataMap);
  const btcTail = (dataMap[REF_SYMBOL] && dataMap[REF_SYMBOL].d) || [];
  saveMeta({
    lastRun: Date.now(),
    dataDate: heute,
    // BTC-Datumsliste mitschreiben. Nur damit laesst sich der Bezugstag als echtes Datum
    // anzeigen statt als "minus N Tage".
    benchTail: btcTail.slice(-8).map(v=>String(v).slice(0,10)),
    bench: REF_SYMBOL,
    stopped: limitHit ? 'limit' : (failed.length ? 'fehler' : null),
    failed: failed.slice(0,20),
    stoppedAt: limitHit ? failed.at(-1) : null
  });
  render(dataMap);
  if(limitHit){
    toast('Twelve-Data-Limit erreicht. Restliche Ticker morgen laden – bereits geladene bleiben erhalten.', true);
  } else if(failed.length){
    toast('Nicht geladen: '+failed.slice(0,6).join(', ')+(failed.length>6?' …':''), true);
  }
}

/* ---------- Ladezustand ---------- */
function saveMeta(o){ try{ localStorage.setItem('rsc.meta', JSON.stringify(o)); }catch(e){} }
function loadMeta(){ try{ return JSON.parse(localStorage.getItem('rsc.meta')||'null'); }catch(e){ return null; } }

// Welche Ticker fehlen noch? Basis fuer Statuszeile und "Fehlende laden". BTC ist ein
// normaler Ticker (anders als der separat behandelte Benchmark der Aktien-App), daher
// keine Ausnahme mehr noetig.
function missingSyms(dataMap){
  const syms = [...new Set(ROWS.filter(r=>r.type==='tk').map(r=>r.ticker))];
  return syms.filter(s=> !(dataMap && dataMap[s] && dataMap[s].c));
}
// Ticker, deren Kurse aelter sind als der Datenstand des Laufs. Entstehen, wenn ein Lauf
// abbricht und spaeter fortgesetzt wird — dann stehen zwei Tage nebeneinander.
function staleSyms(dataMap){
  const meta = loadMeta() || {};
  if(!meta.dataDate || !dataMap) return [];
  const syms = [...new Set(ROWS.filter(r=>r.type==='tk').map(r=>r.ticker))];
  return syms.filter(s=>{
    const d = dataMap[s];
    return d && d.c && d.asOf && d.asOf !== meta.dataDate;
  });
}
function fmtDay(iso){
  if(!iso) return '–';
  const p = String(iso).slice(0,10).split('-');
  return p.length===3 ? `${p[2]}.${p[1]}.${p[0].slice(2)}` : iso;
}
function renderStatus(dataMap){
  if(running) return;                       // waehrend des Ladens zeigt showStatus den Fortschritt
  const el = $('#status'); if(!el) return;
  if(!localStorage.getItem(LS.key)){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');

  const meta = loadMeta() || {};
  const syms = [...new Set(ROWS.filter(r=>r.type==='tk').map(r=>r.ticker))];
  const miss = missingSyms(dataMap);
  const okCount = syms.length - miss.length;

  // Datenstand: das angezeigte Fenster endet lagDays vor dem letzten geladenen Kurstag
  // Bezugstag als echtes Datum: der Tag, auf dem das Fenster endet. Fehlt die Liste der
  // Handelstage (Cache aus einer aelteren Fassung), bleibt die alte "minus N"-Schreibweise.
  let stand;
  const bt = meta.benchTail;
  if(bt && bt.length > lagDays){
    stand = fmtDay(bt[bt.length-1-lagDays]);
  } else {
    stand = fmtDay(meta.dataDate) + (lagDays>0 ? `−${lagDays}T` : '');
  }
  const lauf = meta.lastRun
    ? new Date(meta.lastRun).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})
    : 'nie';

  const alt = staleSyms(dataMap);
  let kind = 'live', txt = `Bezug ${stand} · geladen ${lauf}`, extra = `${okCount}/${syms.length}`;
  if(alt.length){
    kind = 'err';
    txt = `${alt.length} Ticker noch vom Vortag · Bezug ${stand}`;
  } else if(miss.length){
    kind = meta.stopped==='limit' ? 'err' : 'warn';
    if(meta.stopped==='limit') txt = `Tageslimit${meta.stoppedAt?' bei '+meta.stoppedAt:''} · Bezug ${stand}`;
  }
  $('#statusDot').className = 'dot ' + (kind==='err'?'err':(kind==='warn'?'warn':'live'));
  $('#statusText').textContent = txt;
  const offen = alt.length + miss.length;
  $('#statusMeta').innerHTML = offen
    ? `<span title="${esc([...alt,...miss].slice(0,25).join(', '))}">${extra}</span> <button class="ministat" onclick="refresh()">${alt.length?'Angleichen':'Fehlende laden'}</button>`
    : extra;
}

// RS_STS % = Zeit-Perzentil der heutigen RS innerhalb des Fensters.
// Jeffs Excel-Formel (Screenshot vom 15.07.2024): =PERCENTRANK(AF3:BD3,BD3)
// -> also PERCENTRANK.INC der letzten RS gegen die eigene Reihe, NICHT gegen die Peer-Gruppe.
// Alternative: Perzentilrang der heutigen RS INNERHALB der Gruppe (frühere Annahme).
// Bleibt als Vergleichsmodus erhalten, ist aber nicht Jeffs Formel.
function computePeerRanks(dataMap){
  let cur=[]; const groups=[];
  ROWS.forEach(r=>{
    if(r.type==='group'){ if(cur.length) groups.push(cur); cur=[]; }
    else cur.push(r.ticker);
  });
  if(cur.length) groups.push(cur);
  groups.forEach(tickers=>{
    const vals = tickers.map(t=>{
      const d=dataMap[t];
      return (d&&d.rs&&d.rs.length)? d.rs.at(-1) : null;
    }).filter(v=>v!=null);
    tickers.forEach(t=>{
      const d=dataMap[t];
      if(!d||!d.rs||!d.rs.length) return;
      d.pct = vals.length>=2 ? percentRank(vals, d.rs.at(-1)) : (d.timePct??null);
    });
  });
}

// Stochastik-Position im Fenster: 0 % = auf dem Tief, 100 % = auf dem Hoch.
function stochPos(w){
  let mn=w[0], mx=w[0];
  for(const v of w){ if(v<mn) mn=v; if(v>mx) mx=v; }
  return mx===mn ? 0 : (w.at(-1)-mn)/(mx-mn);
}

// Baut eine Datum->Kurs-Map aus BTCs roher Preisreihe. Grundlage fuer den vs-BTC-Modus.
// null im vs-USD-Modus oder wenn BTC noch nicht geladen ist.
function buildBtcMap(dataMap){
  if(refMode!=='btc') return null;
  const btc = dataMap[REF_SYMBOL];
  if(!btc || !btc.d || !btc.d.length) return null;
  return Object.fromEntries(btc.d.map((dt,i)=>[dt, btc.c[i]]));
}
// Liefert die volle, ref-mode-abhaengige Kursreihe eines Coins: im vs-BTC-Modus
// Coin-Kurs/BTC-Kurs am selben Datum (Datums-Abgleich statt Index-Position, damit ein
// zeitversetzt gecachter Coin nicht gegen den falschen BTC-Tag geteilt wird), im
// vs-USD-Modus die rohe Preisreihe direkt.
function refFullSeries(dataMap, sym, btcMap){
  const d = dataMap[sym];
  if(!d || !d.d || !d.c || !d.d.length) return null;
  if(refMode!=='btc') return d.c.slice();
  if(!btcMap) return null;
  const out = [];
  for(let i=0;i<d.d.length;i++){ const bv=btcMap[d.d[i]]; if(bv!=null) out.push(d.c[i]/bv); }
  return out;
}

// Schneidet aus der gespeicherten Historie das eingestellte Fenster und leitet alle
// Anzeigewerte daraus ab. Laeuft bei jedem Rendern — Fensterwechsel und Referenz-Umschalten
// kosten kein Neuladen.
function applyPct(dataMap){
  if(!dataMap) return;
  const btcMap = buildBtcMap(dataMap);
  Object.keys(dataMap).forEach(sym=>{
    const d = dataMap[sym];
    if(!d) return;
    let full = refFullSeries(dataMap, sym, btcMap);
    if(lagDays>0 && full && full.length>lagDays) full = full.slice(0, -lagDays);
    if(!full || full.length<3){ d.rs=null; d.pct=null; d.thrust=null; return; }
    const w = full.slice(-windowN);
    const base = w[0];
    d.rs = w.map(x=> x/base);                // auf Fensterstart normiert, fuer das Histogramm
    d.timePct = percentRank(d.rs, d.rs.at(-1));
    d.stochPct = stochPos(d.rs);
    d.thrust = weightedThrust(d.rs);
    // Tages-RS: Veraenderung der RS am letzten Tag, in Prozent. Misst Rotation —
    // steigt alles gleich stark, ist das 0, obwohl die Tagesperformance hoch war.
    d.dayRS = w.length>=2 ? (w.at(-1)/w.at(-2) - 1) * 100 : null;
    // Volatilitaetsbereinigte Variante: Tages-RS in Standardabweichungen der eigenen
    // RS-Tagesschwankung. Antwortet auf "wie ungewoehnlich war die Bewegung fuer diese
    // Gruppe" statt "wie gross war sie". Braucht keine zusaetzlichen Kursdaten.
    d.daySigma = null;
    if(w.length>=8){
      const ch = [];
      for(let i=1;i<w.length;i++) ch.push(w[i]/w[i-1]-1);
      const mean = ch.reduce((a,b)=>a+b,0)/ch.length;
      const sd = Math.sqrt(ch.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(ch.length-1));
      if(sd>0) d.daySigma = (ch.at(-1)) / sd;
    }
    d.pct = pctMode==='stoch' ? d.stochPct : d.timePct;
    // "3 Monate": fester 90-Tage-Zeitraum, unabhaengig von windowN. Immer Zeit-Perzentil
    // (unabhaengig vom RS-%-Spalte-Setting) — Peer-Rang/Stochastik ueber einen zweiten,
    // versteckten Zeitraum haette kaum zusaetzlichen Wert und verdoppelt nur die Optionen.
    const w3 = full.slice(-WINDOW_3M);
    if(w3.length>=WINDOW_3M){
      const base3 = w3[0];
      const rs3 = w3.map(x=>x/base3);
      d.pct3m = percentRank(rs3, rs3.at(-1));
    } else d.pct3m = null;
    // Abstand zum 52-Wochen-Hoch, aus dem Kurs — die Monats-RS kennt nur windowN Tage und
    // weiss nichts vom Jahreskontext. Genau diese Luecke schliesst der Wert.
    // Tages-Kursaenderung auf denselben Tag beziehen wie die Tages-RS. Fehlt der
    // Kursschwanz (Cache aus einer aelteren Fassung), bleibt der gespeicherte Wert stehen.
    const t = d.tail;
    if(t && t.length >= lagDays+2){
      const i = t.length-1-lagDays;
      d.dayChg = (t[i]/t[i-1] - 1)*100;
      d.closeNow = t[i];
    }
    const bezug = d.closeNow ?? d.lastClose;
    d.offHigh = (d.hi52 && bezug) ? (bezug/d.hi52 - 1)*100 : null;
    // Abstand ueber dem 52-Wochen-Tief. Gegenstueck zu offHigh, fuer die Schwaeche-Karten.
    d.offLow  = (d.lo52 && bezug) ? (bezug/d.lo52 - 1)*100 : null;
  });
  if(pctMode==='peer') computePeerRanks(dataMap);
}

// „heute geladen"-Tracking pro Tag
function getLoadedToday(dayKey){
  try{ const o=JSON.parse(localStorage.getItem('rsc.loaded')||'{}'); return o.day===dayKey?(o.map||{}):{}; }
  catch(e){ return {}; }
}
function saveLoadedToday(dayKey, map){
  try{ localStorage.setItem('rsc.loaded', JSON.stringify({day:dayKey, map})); }catch(e){}
}

function saveCache(map){ try{ localStorage.setItem(LS.cache, JSON.stringify({t:Date.now(),map})); }catch(e){} }
function loadCache(){ try{ const c=JSON.parse(localStorage.getItem(LS.cache)); return c?c.map:null; }catch(e){ return null; } }
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- Laden ueber lange Strecken am Leben halten ---------- */
// iOS drosselt bzw. stoppt Timer, sobald die Seite in den Hintergrund geht oder der
// Bildschirm sperrt. Bei ~13 Minuten Ladezeit reisst der Lauf dadurch zuverlaessig ab.
let running = false;
let wakeLock = null;
async function acquireWakeLock(){
  running = true;
  try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){ wakeLock = null; }
  return wakeLock;
}
// Fuer die Statuszeile waehrend des Ladens: greift die Bildschirmsperre-Verhinderung?
function wakeInfo(){
  if(!('wakeLock' in navigator)) return '· Bildschirm sperrt (nicht unterstützt)';
  return wakeLock ? '· Bildschirm bleibt an' : '· Bildschirm sperrt (abgelehnt)';
}
function releaseWakeLock(){
  running = false;
  try{ wakeLock?.release(); }catch(e){}
  wakeLock = null;
}
// Nach der Rueckkehr in den Vordergrund automatisch weitermachen. Der Tages-Cache sorgt
// dafuer, dass nur die noch fehlenden Ticker geholt werden.
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  // Das System gibt den Wake Lock beim Wegschalten frei — beim Zurueckkommen neu holen.
  if(running){ acquireWakeLock(); return; }
  if(!autoResume) return;        // sonst laedt die App scheinbar von selbst nach
  if(!localStorage.getItem(LS.key)) return;
  const syms = [...new Set(ROWS.filter(r=>r.type==='tk').map(r=>r.ticker))];
  const cache = loadCache() || {};
  const missing = syms.filter(s=> !(cache[s] && cache[s].c));
  if(missing.length){
    toast(`Fortsetzen: ${missing.length} Ticker fehlen noch`);
    setTimeout(refresh, 400);
  }
});

// Aus Cache rendern und dabei Peer-Ranks frisch berechnen (konsistente 1M-Anzeige)
function renderCached(){
  const m = loadCache();
  if(m) applyPct(m);
  render(m);
}

/* ---------- Status / toast ---------- */
function showStatus(kind,text,meta){
  const s=$('#status'); s.classList.remove('hidden');
  $('#statusDot').className='dot '+(kind==='err'?'err':(kind==='live'?'live':''));
  $('#statusText').textContent=text; $('#statusMeta').textContent=meta||'';
}
let toastT;
function toast(msg,isErr){
  const t=$('#toast'); t.textContent=msg; t.className='toast show'+(isErr?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(isErr?' err':''),3200);
}

/* ---------- Sheets ---------- */
function openSheet(which){
  const bg = which==='ticker'?$('#tickerBg'):$('#setBg');
  const sh = which==='ticker'?$('#tickerSheet'):$('#setSheet');
  if(which==='ticker'){ $('#tickerText').value = localStorage.getItem(LS.tickers)||DEFAULT_TICKERS; $('#holdText').value = localStorage.getItem('rsc.holdings')||DEFAULT_HOLDINGS; }
  if(which==='set'){
    $('#apiKey').value = localStorage.getItem(LS.key)||'';
    $('#windowN').value = windowN;
    $('#pctSel').value = pctMode;
    $('#lagSel').value = String(lagDays);
    $('#closedSel').value = closedOnly?'1':'0';
    $('#autoSel').value = autoResume?'1':'0';
    $('#chartSel').value = chartSrc;
    $('#sigSel').value = sigmaDay?'1':'0';
    $('#histSel').value = histScale;
    $('#openSel').value = chartOpen;
    $('#pctWinLbl').textContent = windowN;
  }
  bg.classList.add('open'); sh.classList.add('open');
}
function closeSheets(){
  document.querySelectorAll('.sheet-bg,.sheet').forEach(el=>el.classList.remove('open'));
}

/* ---------- Wire up ---------- */
$('#btnRefresh').onclick = refresh;
$('#btnTickers').onclick = ()=>openSheet('ticker');
$('#btnSettings').onclick = ()=>openSheet('set');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
$('#tickerBg').onclick=closeSheets; $('#setBg').onclick=closeSheets;

// Reiterleiste: Übersicht + Coins. Die Aktien-App trennt Index/Sektoren, Industriegruppen
// und Einzelaktien in drei Reiter — bei Krypto sind alle Coin-Gruppen gleichrangig, daher
// nur ein flacher Reiter statt drei.
function buildTabs(){
  const bar = $('#viewbar');
  bar.innerHTML =
    `<button class="chip" data-tab="dash">Übersicht</button>` +
    `<button class="chip" data-tab="groups">Coins</button>`;
  bar.querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{
      tabMode = c.dataset.tab;
      viewMode = tabMode==='dash' ? 'dash' : 'list';
      collapseAll();
      localStorage.setItem('rsc.tab', tabMode);
      localStorage.setItem('rsc.view', viewMode);
      markTabs(); renderCached(); window.scrollTo(0,0);
    };
  });
  markTabs();
}
function markTabs(){
  document.querySelectorAll('#viewbar .chip').forEach(x=>x.classList.toggle('active', x.dataset.tab===tabMode));
}

// RS-Referenz umschalten (Tap im Header). Reine Neuberechnung wie windowN — kein Neuladen.
function updateRefLabel(){
  $('#benchLabel').textContent = refMode==='btc' ? 'BTC' : 'USD';
}
$('#refToggle').onclick = ()=>{
  refMode = refMode==='btc' ? 'usd' : 'btc';
  localStorage.setItem('rsc.refmode', refMode);
  updateRefLabel();
  renderCached();
};

// Filter "Nahe Hoch"
$('#nearBtn').onclick = ()=>{
  nearOnly = !nearOnly;
  localStorage.setItem('rsc.near', nearOnly?'1':'0');
  $('#nearBtn').classList.toggle('active', nearOnly);
  renderCached();
};

// Sortier-Chips
document.querySelectorAll('.chip[data-sort]').forEach(c=>{
  c.onclick = ()=>{
    sortMode = c.dataset.sort;
    localStorage.setItem('rsc.sort', sortMode);
    document.querySelectorAll('.chip[data-sort]').forEach(x=>x.classList.toggle('active', x===c));
    renderCached();
  };
});

$('#saveTickers').onclick = ()=>{
  const txt = $('#tickerText').value;
  localStorage.setItem(LS.tickers, txt);
  loadTickers(); buildTabs(); closeSheets();
  renderCached();
  toast('Ticker gespeichert');
  setTimeout(refresh, 250);
};
$('#saveHold').onclick = ()=>{
  localStorage.setItem('rsc.holdings', $('#holdText').value);
  loadHoldings(); closeSheets(); renderCached();
  toast(`Bestandteile gespeichert · ${Object.keys(HOLD).length} Ticker`);
};
$('#resetHold').onclick = ()=>{
  $('#holdText').value = DEFAULT_HOLDINGS;
  localStorage.setItem('rsc.holdings', DEFAULT_HOLDINGS);
  loadHoldings(); renderCached(); toast('Bestandteile zurückgesetzt');
};
$('#resetTickers').onclick = ()=>{
  $('#tickerText').value = DEFAULT_TICKERS;
  localStorage.setItem(LS.tickers, DEFAULT_TICKERS);
  loadTickers(); toast('Standardliste geladen');
};
$('#saveSettings').onclick = ()=>{
  const k=$('#apiKey').value.trim();
  localStorage.setItem(LS.key, k);

  const prevWin = windowN;
  windowN = Math.max(10,Math.min(60,+$('#windowN').value||30)); localStorage.setItem(LS.win, windowN);
  pctMode = $('#pctSel').value; localStorage.setItem('rsc.pctmode', pctMode);
  chartSrc = $('#chartSel').value; localStorage.setItem('rsc.chartsrc', chartSrc);
  sigmaDay = $('#sigSel').value==='1'; localStorage.setItem('rsc.sigma', sigmaDay?'1':'0');
  histScale = $('#histSel').value; localStorage.setItem('rsc.hist', histScale);
  chartOpen = $('#openSel').value; localStorage.setItem('rsc.chartopen', chartOpen);
  lagDays = +$('#lagSel').value; localStorage.setItem('rsc.lag', lagDays);
  const prevClosed = closedOnly;
  closedOnly = $('#closedSel').value==='1'; localStorage.setItem('rsc.closed', closedOnly?'1':'0');
  autoResume = $('#autoSel').value==='1'; localStorage.setItem('rsc.autoresume', autoResume?'1':'0');
  closeSheets();

  // Nur "Nur abgeschlossene Handelstage" macht die gespeicherten Reihen ungültig (verschiebt,
  // was als "aktuellster Tag" gilt). Fenster, Referenz-Modus und Maß werden aus der
  // vorhandenen Historie neu berechnet — kein Neuladen nötig.
  const closedChanged = closedOnly!==prevClosed;
  if(closedChanged){ localStorage.removeItem(LS.cache); localStorage.removeItem('rsc.loaded'); }

  if(!k){ render(null); return; }
  if(closedChanged){ toast('Datenbasis geändert – lade alles neu …'); setTimeout(()=>refresh({force:true}),250); return; }
  renderCached();
  toast(windowN!==prevWin ? `Fenster: ${windowN} Tage – neu berechnet` : 'Gespeichert');
};

$('#forceReload').onclick = ()=>{
  closeSheets();
  toast('Lade alle Ticker neu …');
  setTimeout(()=>refresh({force:true}), 250);
};

$('#testConn').onclick = async ()=>{
  const k=$('#apiKey').value.trim();
  const res=$('#testResult');
  if(!k){ res.innerHTML='<span style="color:var(--down)">Kein API-Key eingegeben.</span>'; return; }
  const probes=['BTC','ETH','SOL'];
  res.innerHTML='Teste …';
  let out=[];
  for(const sym of probes){
    try{
      const r=await fetch(`${API}?symbol=${encodeURIComponent(pairSymbol(sym))}&interval=1day&outputsize=2&apikey=${encodeURIComponent(k)}`);
      const j=await r.json();
      if(j.status==='error') out.push(`<div><b style="color:var(--down)">✕ ${sym}/USD</b> — ${esc((j.message||'').slice(0,60))}</div>`);
      else if(j.values) out.push(`<div><b style="color:var(--up)">✓ ${sym}/USD</b> — ok</div>`);
      else out.push(`<div><b style="color:var(--gold)">? ${sym}/USD</b> — keine Daten</div>`);
    }catch(e){ out.push(`<div><b style="color:var(--down)">✕ ${sym}/USD</b> — Netzwerkfehler</div>`); }
    res.innerHTML=out.join('');
  }
  const btcOk = out[0].includes('✓');
  out.push(`<div style="margin-top:8px;color:var(--dim)">${btcOk?'BTC/USD funktioniert — Referenz verfügbar.':'BTC/USD liefert keine Daten — ohne Referenz funktioniert der Modus „vs BTC" nicht, „vs USD" bleibt unabhängig davon nutzbar.'}</div>`);
  res.innerHTML=out.join('');
};

/* ---------- Init ---------- */
loadTickers();
loadHoldings();
updateRefLabel();
document.querySelectorAll('.chip[data-sort]').forEach(x=>x.classList.toggle('active', x.dataset.sort===sortMode));
buildTabs();
$('#nearBtn').classList.toggle('active', nearOnly);
renderCached();
if('serviceWorker' in navigator){/* offline shell optional */}
</script>
</body>
