<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<!-- Ohne das haelt iOS die Seite im Cache und zeigt nach einem Update noch die alte
     Fassung — mit alten Einstellungen im Setup, was schwer zu durchschauen ist. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skywalker Crypto RS">
<title>Skywalker Crypto RS</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20180%20180'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%2308182b'/%3E%3Cstop%20offset='1'%20stop-color='%230b3350'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='180'%20height='180'%20fill='url(%23g)'/%3E%3Cg%20stroke='%233ad6ff'%20stroke-width='1.6'%20opacity='.17'%20fill='none'%3E%3Cpath%20d='M0%20124h180M0%20139h180M0%20156h180M0%20175h180'/%3E%3Cpath%20d='M90%20114L14%20180M90%20114L56%20180M90%20114L124%20180M90%20114L166%20180'/%3E%3C/g%3E%3Cg%20fill='none'%20stroke='%233ad6ff'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M26%20126L58%2094L82%20108L108%2068L132%2082L156%2036'%20stroke-width='22'%20opacity='.10'/%3E%3Cpath%20d='M26%20126L58%2094L82%20108L108%2068L132%2082L156%2036'%20stroke-width='13'%20opacity='.22'/%3E%3Cpath%20d='M26%20126L58%2094L82%20108L108%2068L132%2082L156%2036'%20stroke-width='7'/%3E%3C/g%3E%3Ccircle%20cx='156'%20cy='36'%20r='14'%20fill='%23ff5cf0'%20opacity='.20'/%3E%3Ccircle%20cx='156'%20cy='36'%20r='7.5'%20fill='%23ff5cf0'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Skywalker%20Crypto%20RS%22%2C%22short_name%22%3A%22Crypto%20RS%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0e14%22%2C%22theme_color%22%3A%22%230a0e14%22%2C%22start_url%22%3A%22.%22%2C%22icons%22%3A[%7B%22src%22%3A%22data%3Aimage%2Fsvg+xml%2C%253Csvg%2520xmlns=%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%2520viewBox=%270%25200%2520180%2520180%27%253E%253Crect%2520width=%27180%27%2520height=%27180%27%2520fill=%27%25230b3350%27%2F%253E%253Cpath%2520d=%27M26%2520126L58%252094L82%2520108L108%252068L132%252082L156%252036%27%2520fill=%27none%27%2520stroke=%27%25233ad6ff%27%2520stroke-width=%2713%27%2520stroke-linecap=%27round%27%2520stroke-linejoin=%27round%27%2F%253E%253Ccircle%2520cx=%27156%27%2520cy=%2736%27%2520r=%279%27%2520fill=%27%2523ff5cf0%27%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22180x180%22%2C%22type%22%3A%22image%2Fsvg+xml%22%7D]%7D">
<style>
  :root{
    --bg:#0a0e14; --panel:#111722; --panel2:#0d1420; --line:#1c2534;
    --ink:#e6edf3; --dim:#7d8aa0; --faint:#4a5568;
    --up:#3ad6ff; --up-soft:#0b2b3d; --down:#f87171; --down-soft:#3a1f22;
    --accent:#38bdf8; --gold:#fbbf24;
    --mono:'SF Mono',ui-monospace,'JetBrains Mono','Menlo',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}

  header{
    position:sticky;top:0;z-index:20;background:rgba(10,14,20,.92);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-top)) 12px;padding-top:calc(10px + env(safe-area-inset-top));
  }
  .brand{display:flex;align-items:center;gap:9px}
  .logo{width:22px;height:22px;flex:none}
  .title{font-weight:700;font-size:16px;letter-spacing:.02em}
  .title small{font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
  .bench{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .bench b{color:var(--accent)}
  .bench.tappable{cursor:pointer;padding:3px 7px;border-radius:8px;background:var(--panel2)}
  .bench.tappable:active{background:var(--line)}
  .toolbar{display:flex;gap:6px;margin-top:9px}
  button.tb{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 4px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.12s;
  }
  button.tb:active{transform:scale(.97);background:var(--line)}
  button.tb.primary{background:var(--up-soft);border-color:#1d5a78;color:var(--up)}
  button.tb svg{width:14px;height:14px}

  .sortbar{display:flex;align-items:center;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sortbar::-webkit-scrollbar{display:none}
  .sortlbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:none;font-weight:600}
  .chip{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;cursor:pointer;transition:.12s;font-family:var(--sans)}
  .chip:active{transform:scale(.96)}
  .chip.active{background:var(--up-soft);border-color:#23617f;color:var(--up)}

  .nm-pop{position:fixed;left:12px;right:12px;z-index:50;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.15s;transform:translateY(-4px)}
  .nm-pop.show{opacity:1;pointer-events:auto;transform:translateY(0)}
  .nm-pop .t{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--ink)}
  .nm-pop .s{font-size:12px;color:var(--dim);margin-top:3px}
  .nm-pop .stats{display:flex;gap:14px;margin-top:9px;font-family:var(--mono);font-size:11px}
  .nm-pop .stats b{display:block;color:var(--faint);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}

  .status{font-family:var(--mono);font-size:10.5px;color:var(--dim);padding:6px 12px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .status .dot.live{background:var(--up);box-shadow:0 0 8px var(--up)}
  .status .dot.err{background:var(--down)}
  .status .dot.warn{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  /* Raster statt Fluss: Der Text bekommt den Rest und wird bei Bedarf gekuerzt, die
     Zaehler-Spalte behaelt ihre Breite. Vorher konnten beide ineinanderlaufen. */
  .status{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:4px}
  .status > span:first-child{min-width:0}
  .status #statusText{min-width:0}
  .group-head.tappable{cursor:pointer;display:flex;align-items:center;gap:6px}
  .group-head .gcount{color:var(--faint);font-size:9px}
  .group-head .gstr{margin-left:auto;color:var(--up);font-size:9px;font-weight:700}
  .group-head .grank{background:var(--up-soft);color:var(--up);border-radius:9px;
    padding:1px 6px;font-size:9px;font-weight:700;flex:none}
  .rnk{display:inline-block;min-width:15px;color:var(--faint);font-size:10px;font-weight:600;margin-right:3px}
  .status.hidden{display:none}
  .status #statusText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status #statusMeta{display:flex;align-items:center;gap:7px;flex:none}
  button.ministat{background:var(--up-soft);border:1px solid #1d5a78;color:var(--up);
    font-family:var(--sans);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:11px;cursor:pointer}
  button.ministat:active{transform:scale(.96)}

  main{padding:0 0 40px}
  .group-head{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);padding:14px 12px 5px;position:sticky;top:0;
    background:linear-gradient(180deg,var(--bg),rgba(10,14,20,.6));z-index:5;
  }
  .row{
    display:grid;grid-template-columns:84px minmax(0,1fr) 46px 46px 28px;align-items:center;
    column-gap:6px;row-gap:5px;
    padding:8px 10px;border-bottom:1px solid var(--line);position:relative;
  }
  /* Eigene Zeile ueber die volle Breite statt in der schmalen Ticker-Spalte.
     Drei feste Spalten, damit die Werte untereinander aller Zeilen fluchten. */
  .metrics{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:4px;margin-top:1px}
  .metrics .m{display:flex;align-items:baseline;gap:5px;min-width:0;
    padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.025)}
  .metrics .m.hi{background:var(--up-soft);box-shadow:inset 0 0 0 1px #1d5a78}
  .metrics .m i{font-style:normal;font-size:8.5px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--faint);flex:none}
  .metrics .m b{font-family:var(--mono);font-size:10.5px;font-weight:700;margin-left:auto;
    white-space:nowrap}
  .colhead{
    display:grid;grid-template-columns:84px minmax(0,1fr) 46px 46px 28px;gap:6px;padding:0 10px 5px;
    font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  }
  .colhead span:nth-child(3),.colhead span:nth-child(4){text-align:center}
  .tk{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.01em;min-width:0}
  .tk .nm{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .tk .meta{display:flex;gap:5px;margin-top:3px;align-items:baseline;font-family:var(--mono);font-size:10px;font-weight:700}
  .tk .meta .lab{color:var(--faint);font-weight:600;font-size:9px}
  .spark{height:34px;width:100%;display:block}
  .spark.empty{opacity:.25}
  .sts{font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;padding:5px 2px;border-radius:7px}
  .thr{font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;padding:5px 2px;border-radius:7px}
  .chg{font-family:var(--mono);font-size:11px;text-align:right;color:var(--dim);display:block}
  .chg.pos{color:var(--up)} .chg.neg{color:var(--down)}
  /* Beschriftung und Zahl duerfen beim Umbruch nicht getrennt werden — sonst steht das
     "RS" am Ende der einen Zeile und sein Wert am Anfang der naechsten. */
  .chg,.dayrs,.off52{white-space:nowrap}
  .dayrs{margin-left:7px;font-size:10px;font-weight:700;opacity:.8}
  .dayrs.pos{color:var(--up)} .dayrs.neg{color:var(--down)}
  .k1{color:var(--faint);font-size:9px;font-weight:600}
  .dayrs.hi{opacity:1;background:var(--up-soft);border-radius:8px;padding:1px 5px}
  .off52{margin-left:7px;font-size:10px;font-weight:700;opacity:.85}
  .off52.near{color:var(--up)} .off52.mid{color:var(--dim)} .off52.far{color:var(--down)}
  .off52.hi{opacity:1;background:var(--up-soft);border-radius:8px;padding:1px 5px}
  .chip.filt{border-style:dashed}
  .chip.filt.active{background:#3a2a10;border-color:var(--gold);color:var(--gold);border-style:solid}
  /* hervorgehobene Spalte des gewaehlten Zeitraums */
  .sts.hi,.thr.hi{outline:1.5px solid var(--up);outline-offset:1px}
  .colhead span.hi{color:var(--up)}
  .tvbtn{width:100%;height:26px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;cursor:pointer;color:var(--faint);margin-top:3px}
  .tvbtn:active{color:var(--accent)}
  .tvbtn svg{width:14px;height:14px}
  .rank-badge{position:absolute;left:0;top:0;bottom:0;width:3px}
  .tk.tappable{cursor:pointer}
  .caret{display:inline-block;font-size:9px;color:var(--faint);margin-left:4px;vertical-align:middle;transition:transform .15s}
  .caret.open{transform:rotate(180deg);color:var(--up)}
  .holds{display:flex;flex-wrap:wrap;gap:5px;padding:9px 12px 11px;background:var(--panel2);
    border-bottom:1px solid var(--line)}
  .holds a{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--up);text-decoration:none;
    background:var(--up-soft);border:1px solid #1d5a78;border-radius:12px;padding:4px 9px}
  .holds a:active{opacity:.7}
  .col4{display:flex;flex-direction:column;align-items:flex-end;justify-content:center}

  /* Übersicht / Dashboard */
  .dash-grp{padding:12px 12px 4px}
  .dash-grp h4{margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);font-weight:600}
  .strip{display:flex;gap:2px;height:30px;border-radius:6px;overflow:hidden;margin-bottom:9px}
  .strip a{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:8.5px;font-weight:700;text-decoration:none;overflow:hidden}
  /* minmax(0,1fr) statt 1fr: Ohne das duerfen lange Namen die Spalte aufblaehen, die
     rechte Karte wird breiter als die linke und die Seite scrollt seitlich. */
  .dash-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
  .dash-card{min-width:0;overflow:hidden}
  .dash-card .ln.kopf{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:2px;pointer-events:none}
  .dash-card .ln.kopf b{color:var(--faint);font-weight:600}
  .dash-card .ln.kopf u{color:var(--faint);font-weight:600;width:34px;text-align:right}
  .dash-card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 9px}
  .dash-card h5{margin:0 0 6px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);font-weight:700}
  .dash-card .ln{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:11.5px;
    padding:2.5px 0;text-decoration:none}
  .dash-card .ln b{font-weight:700;color:var(--ink);flex:none;width:44px}
  .dash-card .ln i{font-style:normal;color:var(--dim);font-size:9.5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .dash-card .ln u{text-decoration:none;font-weight:700;flex:none;margin-left:5px;width:34px;text-align:right}
  /* Auf- und Absteiger ueber die volle Breite: Ticker, Name, Rang und Plaetze passen
     nebeneinander nicht in eine halbe Kartenspalte - der Name wurde auf 0 px gequetscht. */
  .dash-cols.movers{grid-template-columns:minmax(0,1fr)}
  .movers .ln u{width:52px}
  .movers .ln.kopf u{width:52px}
  .dash-card.lead{border-color:#1d5a78;background:#0a2231}
  /* Neutral-Gold statt Rot: Die Karte heisst "Momentum Leaders", eine Warnfarbe
     wuerde dem Namen widersprechen. Sie bleibt trotzdem klar von der linken zu trennen. */
  .dash-card.warn{border-color:#5c4410;background:#221a08}
  .dash-card.weak{border-color:#5b2a2e;background:#25151a}
  .dash-card.down{border-color:#4a3352;background:#1d1424}
  .dash-card .ln u .alt{font-weight:600;color:var(--faint);font-size:9px}
  .dash-card h5 span{font-weight:600;opacity:.75}
  .dash-card .leer{font-size:10.5px;color:var(--faint);padding:3px 0}
  .dash-legend{padding:2px 12px 22px;font-family:var(--mono);font-size:9.5px;color:var(--faint);line-height:1.6}

  .empty-state{text-align:center;padding:60px 30px;color:var(--dim)}
  .empty-state h2{color:var(--ink);font-size:17px;margin:0 0 8px}
  .empty-state p{font-size:13px;line-height:1.6;margin:0 0 20px}
  .empty-state .k{font-family:var(--mono);color:var(--accent)}

  /* Sheet / modal */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:.2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
    max-height:88vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.open{transform:translateY(0)}
  .sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--faint);margin:9px auto 4px}
  .sheet-head{display:flex;align-items:center;padding:6px 16px 12px;border-bottom:1px solid var(--line)}
  .sheet-head h3{margin:0;font-size:15px;font-weight:700}
  .sheet-head .x{margin-left:auto;background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
  .sheet-body{overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}

  label.field{display:block;margin-bottom:16px}
  label.field .lab{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px;display:block}
  label.field .hint{font-size:11px;color:var(--faint);font-weight:400;margin-top:5px;line-height:1.5}
  input.inp,textarea.inp,select.inp{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:13px;padding:11px 12px;border-radius:9px;
  }
  input.inp:focus,textarea.inp:focus{outline:none;border-color:var(--accent)}
  textarea.inp{min-height:220px;resize:vertical;line-height:1.7;white-space:pre;overflow-x:auto}
  .btn-primary{
    width:100%;background:var(--up);border:none;color:#062012;font-weight:700;font-size:14px;
    padding:13px;border-radius:10px;cursor:pointer;margin-top:4px;
  }
  .btn-primary:active{opacity:.85}
  .btn-ghost{
    width:100%;background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:600;font-size:13px;
    padding:11px;border-radius:10px;cursor:pointer;margin-top:9px;
  }
  .keylink{color:var(--accent);text-decoration:none}
  .seg-legend{font-size:11px;color:var(--faint);line-height:1.7;font-family:var(--mono)}
  .seg-legend b{color:var(--dim)}
  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:var(--line);color:var(--ink);font-size:12.5px;padding:10px 16px;border-radius:20px;z-index:60;
    opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--down-soft);color:#fca5a5;border:1px solid #5b2a2e}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 180 180"><g fill="var(--up)">
      <rect x="30" y="110" width="12" height="40"/><rect x="48" y="90" width="12" height="60"/>
      <rect x="66" y="70" width="12" height="80"/><rect x="84" y="50" width="12" height="100"/>
      <rect x="102" y="64" width="12" height="86"/><rect x="120" y="40" width="12" height="110"/>
      <rect x="138" y="58" width="12" height="92"/></g></svg>
    <span class="title">Skywalker Crypto RS<small id="verLbl">v2026.08.27-1</small></span>
    <span class="bench tappable" id="refToggle" role="button" tabindex="0" title="Tippen zum Umschalten">vs <b id="benchLabel">BTC</b></span>
  </div>

      <b>Safari-App</b> öffnet den Link in Safari selbst. Genau dort entsteht das Problem, das du beschrieben hast: Zehn Ticker heißen zehn Tabs.<br>

<script>
"use strict";
const LS = {
  key:'rsc.apikey', tickers:'rsc.tickers', win:'rsc.window', cache:'rsc.cache'
};
// Eigener Präfix "rsc." statt "rs." — läuft die Aktien-App auf demselben Ursprung (nur
// anderer Pfad), teilt sie sich sonst denselben localStorage und beide Apps überschreiben
// sich gegenseitig Ticker-Liste, Cache und Einstellungen.
const $ = s => document.querySelector(s);

/* ---------- Default ticker list (Krypto, nach Sektoren gruppiert) ----------
   BTC steht als "(Anker)" am Anfang jeder Sektor-Gruppe, genau wie SPY in der Aktien-App
   dreifach als Anker in Equal-Weight-/SPDR-Sektoren auftaucht — kostet dank Set-Dedup beim
   Abruf (syms) keinen zusaetzlichen API-Call, gibt aber jedem Sektor eine direkte
   Vergleichszeile gegen Bitcoin.
   Jeder einzelne Ticker unten wurde am 27.08.2026 gegen die echte Twelve-Data-API geprueft
   (BTC/ETH/SOL zuerst manuell, der Rest per Skript ueber alle Kandidaten, ratenlimitiert).
   Dabei aufgefallen und beruecksichtigt:
   - MATIC -> POL (Polygon-Rebrand), MKR -> SKY (Maker-Rebrand) sind unter dem alten Ticker
     bei Twelve Data NICHT mehr auffindbar, unter dem neuen schon.
   - WIF, BONK, HYPE, FLOKI, PUMP fuehrt Twelve Data nur als /USDT-Paar, nicht /USD — dafuer
     hat refresh() einen automatischen Fallback (siehe fetchSeries-Aufruf weiter unten).
   - TON, JUP, PLUME, BEAM, CFG, KCS liefert Twelve Data unter keinem der beiden Paare —
     bewusst NICHT in der Liste (waeren dauerhaft "—" in der App). */
const DEFAULT_TICKERS = `#Referenz

// Krypto-Coins haben keine "Bestandteile" im ETF-Sinn — Standardliste bewusst leer,
// im Ticker-Sheet aber editierbar (z.B. für Liquid-Staking-Derivate wie STETH unter ETH).
const DEFAULT_HOLDINGS = ``;

/* ---------- State ---------- */
let ROWS = [];        // parsed ticker list [{type:'group'|'tk', label, ticker, name}]

// RS-Referenz: 'btc' (Coin ÷ BTC) oder 'usd' (normierte eigene USD-Preisreihe).
// Umschaltbar per Tap im Header, kostet kein Neuladen — reine Neuberechnung wie windowN.
let refMode = localStorage.getItem('rsc.refmode') || 'btc';
// Fixer Referenz-Ticker. Anders als bei der Aktien-App (RSP/SPY/SPX mit Fallback) gibt es
// bei Krypto keine Alternative zu BTC als Marktreferenz — kein Fallback-Mechanismus nötig.
const REF_SYMBOL = 'BTC';
let windowN = +(localStorage.getItem(LS.win) || 30);
let pctMode = localStorage.getItem('rsc.pctmode') || 'time';   // 'time' | 'stoch' | 'peer'
// Anders als bei der Aktien-App (Versatz=1, um Jeffs Excel-Sheet zu treffen) gibt es für
// Krypto keine externe Referenztabelle zum Abgleichen — Standard ist der aktuellste Tag.
let lagDays = +(localStorage.getItem('rsc.lag') ?? 0);
// 260 Kalendertage Historie. Twelve Data rechnet Credits pro Abruf, nicht pro Datenzeile —
// die laengere Historie kostet also keinen einzigen zusaetzlichen Aufruf, ermoeglicht aber
// den Abstand zum 52-Wochen-Hoch.
const HISTORY = 260;
// Fester zweiter Zeitraum "3 Monate" (90 Kalendertage = 3 × 30), unabhaengig vom
// einstellbaren windowN-Fenster ("Monat"). Nutzt dieselbe Historie, kein Neuladen.
const WINDOW_3M = 90;
const NEAR_HIGH = -10;    // Schwelle "nahe am Hoch" in Prozent
const FAR_HIGH  = -25;    // weiter darunter: starkes Momentum, aber ohne Basis am Jahreshoch
const NEAR_LOW  =  10;    // Schwelle "nahe am Tief": hoechstens so weit darueber
const FAR_LOW   =  25;    // weiter darueber: schwach, aber noch deutlich ueber dem Jahrestief
let chartSrc = localStorage.getItem('rsc.chartsrc') || 'tv'; // Ziel des Chart-Icons
let sigmaDay = localStorage.getItem('rsc.sigma')==='1';        // Tages-RS volatilitaetsbereinigt?
let histScale = localStorage.getItem('rsc.hist') || 'range';   // 'range' | 'start'
let chartOpen = localStorage.getItem('rsc.chartopen') || 'inapp';   // 'inapp' | 'safari'
let nearOnly = localStorage.getItem('rsc.near')==='1';         // nur Gruppen nahe am 52W-Hoch?
let autoResume = localStorage.getItem('rsc.autoresume')==='1';       // beim Zurueckkehren selbst nachladen?
let closedOnly = localStorage.getItem('rsc.closed')!=='0';     // laufenden Kalendertag ausblenden?
let viewMode = localStorage.getItem('rsc.view') || 'list';     // 'list' | 'dash'
let tabMode = localStorage.getItem('rsc.tab') || 'groups';     // 'dash' | 'groups'
// Zugeklappte Gruppen-Ueberschriften
let collapsed = new Set((localStorage.getItem('rsc.collapsed')||'').split('|').filter(Boolean));
// Alle Gruppen zuklappen — nach Ansichtswechsel und nach dem Laden, damit die Liste
// aufgeraeumt startet. Bei nur einem Block bleibt er offen, sonst waere der Schirm leer.
function collapseAll(){
  const labels = buildBlocks().map(b=>b.label).filter(Boolean);
  if(labels.length<2) return;
  labels.forEach(l=>collapsed.add(l));
  localStorage.setItem('rsc.collapsed', [...collapsed].join('|'));
}
function toggleGroup(label){
  if(collapsed.has(label)) collapsed.delete(label); else collapsed.add(label);
  localStorage.setItem('rsc.collapsed', [...collapsed].join('|'));
  renderCached();
}
let sortMode = localStorage.getItem('rsc.sort') || 'orig';

/* ---------- Parsing ---------- */
function parseTickers(text){
  const out = [];
  text.split(/\r?\n/).forEach(raw=>{
    const line = raw.trim();
    if(!line) return;
    if(line.startsWith('#')){ out.push({type:'group', label:line.slice(1).trim()}); return; }
    const [tk, ...rest] = line.split(',');
    const ticker = tk.trim().toUpperCase();
    if(!ticker) return;
    out.push({type:'tk', ticker, name:(rest.join(',').trim()||ticker)});
  });
  return out;
}
function loadTickers(){
  const raw = localStorage.getItem(LS.tickers) || DEFAULT_TICKERS;
  ROWS = parseTickers(raw);
}

/* ---------- Bestandteile ---------- */
let HOLD = {};
const expanded = new Set();
function parseHoldings(text){
  const out = {};
  text.split(/\r?\n/).forEach(raw=>{
    const line = raw.trim();
    if(!line || line.startsWith('#')) return;
    const i = line.indexOf(':');
    if(i<1) return;
    const key = line.slice(0,i).trim().toUpperCase();
    const list = line.slice(i+1).split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
    if(key && list.length) out[key] = list;
  });
  return out;
}
function loadHoldings(){
  HOLD = parseHoldings(localStorage.getItem('rsc.holdings') || DEFAULT_HOLDINGS);
}
function toggleHold(tk, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  if(expanded.has(tk)) expanded.delete(tk); else expanded.add(tk);
  renderCached();
}
function holdingsHTML(tk){
  const list = HOLD[tk];
  if(!list || !expanded.has(tk)) return '';
  return `<div class="holds">${list.map(h=>
    `<a href="${chartURL(h)}"${tvTarget()}>${esc(h)}</a>`).join('')}</div>`;
}

/* ---------- Sparkline (histogram) ---------- */
function histogramSVG(series, opts={}){
  const w = 100, h = 34, n = series.length;
  if(!n) return `<svg class="spark empty" viewBox="0 0 ${w} ${h}"></svg>`;

  // Skala "Spanne": Balken vom Fenster-Tief bis zum Fenster-Hoch, wie Jeffs Excel-Sparkline.
  // Die Hoehe des letzten Balkens entspricht damit direkt der RS-%-Zahl — beides sagt
  // dasselbe aus. Die alte Skala (Abweichung vom Fensterstart) konnte ihr widersprechen:
  // ein Wert kann ueber dem Startwert liegen und trotzdem am unteren Ende der Spanne stehen.
  if(histScale==='range'){
    let mn=series[0], mx=series[0];
    for(const v of series){ if(v<mn) mn=v; if(v>mx) mx=v; }
    const span = Math.max(1e-9, mx-mn);
    const bw = w/n, gap = Math.min(1.2, bw*0.18);
    let hiIdx = 0;
    for(let i=1;i<n;i++) if(series[i] > series[hiIdx]) hiIdx = i;
    let bars = '';
    series.forEach((v,i)=>{
      const frac = (v-mn)/span;                       // 0 = Fenster-Tief, 1 = Fenster-Hoch
      const bh = Math.max(0.8, frac*(h-2));
      const x = i*bw + gap/2, bwi = bw - gap;
      const isLast = i===n-1;
      const col = i===hiIdx ? 'var(--gold)' : (frac>=0.5 ? 'var(--up)' : 'var(--down)');
      const op = (isLast || i===hiIdx) ? 1 : (0.45 + 0.45*(i/(n-1)||0));
      bars += `<rect x="${x.toFixed(2)}" y="${(h-bh).toFixed(2)}" width="${bwi.toFixed(2)}" height="${bh.toFixed(2)}" rx="0.4" fill="${col}" opacity="${op.toFixed(2)}"/>`;
    });
    const mid = `<line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--line)" stroke-width="0.5"/>`;
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${mid}${bars}</svg>`;
  }

  // Skala "Start": Abweichung vom ersten Tag des Fensters (bisherige Darstellung)
  const devs = series.map(v => v - 1);                 // center at 0
  const maxAbs = Math.max(0.0001, ...devs.map(d=>Math.abs(d)));
  const bw = w / n, gap = Math.min(1.2, bw*0.18), mid = h/2;
  let bars = '';
  const last = n-1;
  // Jeffs Legende: "The dark green bar indicates the RS high point."
  let hiIdx = 0;
  for(let i=1;i<n;i++) if(series[i] > series[hiIdx]) hiIdx = i;
  devs.forEach((d,i)=>{
    const bh = Math.max(0.8, (Math.abs(d)/maxAbs) * (h/2 - 1));
    const x = i*bw + gap/2;
    const bwi = bw - gap;
    const up = d >= 0;
    const y = up ? mid - bh : mid;
    // fade older bars a touch; highlight most recent + RS-Hochpunkt
    const isLast = i===last;
    const col = i===hiIdx ? 'var(--gold)' : (up ? 'var(--up)' : 'var(--down)');
    const op = (isLast || i===hiIdx) ? 1 : (0.42 + 0.5*(i/last||0));
    bars += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bwi.toFixed(2)}" height="${bh.toFixed(2)}" rx="0.4" fill="${col}" opacity="${op.toFixed(2)}"/>`;
  });
  const zero = `<line x1="0" y1="${mid}" x2="${w}" y2="${mid}" stroke="var(--line)" stroke-width="0.6"/>`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${zero}${bars}</svg>`;
}

/* ---------- Percentile (Excel PERCENTRANK.INC equivalent) ---------- */
function percentRank(arr, x){
  const a = [...arr].sort((p,q)=>p-q), N=a.length;
  if(N<2) return null;
  if(x<=a[0]) return 0; if(x>=a[N-1]) return 1;
  let i=0; while(i<N-1 && a[i+1]<=x) i++;
  if(a[i]===x) return i/(N-1);
  const lo=a[i], hi=a[i+1];
  return (i + (x-lo)/(hi-lo))/(N-1);
}
function weightedThrust(rs){
  // 1-week weighted RS: gewichtete Summe der täglichen RS-Wachstumsraten über die letzten 5 Tage.
  // Gewichte 5,4,3,2,1 (jüngster Tag am stärksten). Ergebnis als % um 100 herum.
  const n = rs.length;
  if(n < 2) return null;
  const days = Math.min(5, n-1);
  const weights = [];
  for(let k=days;k>=1;k--) weights.push(k);       // z.B. [5,4,3,2,1]
  const wsum = weights.reduce((a,b)=>a+b,0);
  let acc = 0;
  for(let j=0;j<days;j++){
    const idx = n-1-j;                              // jüngster zuerst
    const chg = rs[idx]/rs[idx-1] - 1;
    acc += chg * weights[j];
  }
  const wAvg = acc / wsum;                          // gewichtete mittlere Tagesänderung
  return 1 + wAvg * 5;                              // auf Woche hochrechnen, um 100% zentriert
}
// Thrust liegt eng um 100 % herum, deshalb eine feinere Skala als bei der RS-Spalte.
function thrColor(t){
  if(t==null) return {bg:'transparent',fg:'var(--faint)'};
  const d = (t-1)*100;                     // Abweichung von 100 % in Prozentpunkten
  if(d>=3)  return {bg:'#0b4a6b',fg:'#bae6fd'};
  if(d>=1)  return {bg:'#0d5f85',fg:'#e0f2fe'};
  if(d>=0)  return {bg:'#12313f',fg:'#a5dfff'};
  if(d>=-2) return {bg:'#3a1f22',fg:'#fca5a5'};
  return {bg:'#7f1d1d',fg:'#fecaca'};
}
function stsColor(p){
  if(p==null) return {bg:'transparent',fg:'var(--faint)'};
  // green ramp like the sheet's conditional formatting
  if(p>=0.85) return {bg:'#0b4a6b',fg:'#bae6fd'};
  if(p>=0.65) return {bg:'#0d5f85',fg:'#e0f2fe'};
  if(p>=0.45) return {bg:'#12313f',fg:'#a5dfff'};
  if(p>=0.25) return {bg:'#1c2432',fg:'#94a3b8'};
  return {bg:'transparent',fg:'var(--faint)'};
}

/* ---------- Rendering ---------- */
// Gruppen-Blöcke aus ROWS bilden — von Liste und Übersicht gemeinsam genutzt.
function buildBlocks(){
  const blocks = [];
  let cur = {label:null, items:[]};
  ROWS.forEach(r=>{
    if(r.type==='group'){ if(cur.items.length||cur.label!==null) blocks.push(cur); cur={label:r.label, items:[]}; }
    else cur.items.push(r);
  });
  if(cur.items.length||cur.label!==null) blocks.push(cur);
  return blocks;
}
// Die Aktien-App trennt Index/Sektor-ETFs, Industriegruppen und Einzelaktien in drei
// Reiter — bei Krypto gibt es diese Dreiteilung nicht, alle Coin-Gruppen sind gleichrangig.
// blockTab bleibt als Funktion erhalten (visibleBlocks/collapseAll rufen sie auf), liefert
// aber immer 'groups', wodurch effektiv ein einziger flacher "Coins"-Reiter entsteht.
function blockTab(label){
  return 'groups';
}
function visibleBlocks(){
  const all = buildBlocks().filter(b=> blockTab(b.label)===tabMode || tabMode==='dash');
  // Im Reiter "Gruppen" bei gewaehltem Zeitraum: eine einzige Rangliste ueber alle
  // Industriegruppen hinweg, statt nach Thema getrennt. Bei "Liste" bleibt die Gliederung.
  if(tabMode==='groups' && sortMode!=='orig' && viewMode==='list'){
    // BTC-Anker dedupen: steht in fast jeder Gruppe, wuerde in der zusammengefassten
    // Rangliste sonst zehnmal auftauchen statt einmal.
    const seen = new Set();
    const items = all.flatMap(b=>b.items).filter(r=>{
      if(seen.has(r.ticker)) return false;
      seen.add(r.ticker); return true;
    });
    const name = {dayrs:'Tag', thrust:'Woche', pct:'Monat', pct3m:'3 Monate', chg:'Kurs Tag'}[sortMode] || '';
    return [{label:`Industriegruppen · nach ${name}`, items}];
  }
  return all;
}

// Themenblöcke nach ihrer eigenen Stärke ordnen: Median der Monats-RS aller Mitglieder.
// Der Median statt des Mittelwerts, damit ein einzelner Ausreißer den Block nicht hochzieht.
function blockStrength(bl, dataMap){
  // BTC-Anker ausgeschlossen: im vs-BTC-Modus ist BTCs eigene RS trivial (immer ~0%, weil
  // BTC/BTC konstant ist) — ohne den Ausschluss wuerde jeder Sektor kuenstlich schwaecher
  // wirken, nur weil BTC als Vergleichszeile mit drinsteht.
  const vals = bl.items
    .filter(r=>r.ticker!==REF_SYMBOL)
    .map(r=>{ const d=dataMap&&dataMap[r.ticker]; return d&&d.pct!=null ? d.pct : null; })
    .filter(v=>v!=null).sort((a,b)=>a-b);
  if(!vals.length) return -1;
  const m = Math.floor(vals.length/2);
  return vals.length%2 ? vals[m] : (vals[m-1]+vals[m])/2;
}

/* ---------- Übersicht ---------- */
// Pro Gruppe ein Farbstreifen (Monatsstärke auf einen Blick) und darunter die beiden
// Extreme: stärkste/schwächste nach RS % (Monat) und nach Thrust (Woche).
function renderDash(dataMap){
  const has = t => { const d=dataMap&&dataMap[t]; return d&&d.rs&&d.rs.length ? d : null; };
  let html = '';

  // Sektor-Ranking: alle Gruppen nach durchschnittlicher Monats-RS sortiert — beantwortet
  // direkt "welcher Sektor performt am besten", bevor man in die einzelnen Coins geht.
  const bewerteteSektoren = buildBlocks().filter(b=>b.label)
    .map(b=>({b, st: blockStrength(b, dataMap)})).filter(x=>x.st>=0)
    .sort((a,b)=> b.st-a.st);
  if(bewerteteSektoren.length>1){
    const farbe = st => st>=0.65?'var(--up)':(st<0.35?'var(--down)':'var(--dim)');
    html += `<div class="dash-grp"><h4>Sektor-Ranking <span style="color:var(--faint)">· Ø Monats-RS je Gruppe</span></h4>
      <div class="dash-card lead"><div class="ln kopf"><b>Rang</b><i>Sektor</i><u>Monat</u></div>`
      + bewerteteSektoren.map((x,i)=>
          `<div class="ln"><b>${i+1}</b><i>${esc(x.b.label)} · ${x.b.items.length}</i><u style="color:${farbe(x.st)}">${Math.round(x.st*100)}%</u></div>`
        ).join('') + `</div></div>`;
  }

  // Leader-Panel ueber alle Gruppen hinweg. Die Monats-RS kennt nur windowN Tage; erst
  // zusammen mit dem Abstand zum 52-Wochen-Hoch laesst sich "haelt sich stark" von "ist
  // gerade heissgelaufen" trennen. Anders als die Aktien-App (Sektoren vs. Industriegruppen
  // getrennt) gibt es bei Krypto keine sinnvolle Zweiteilung — alle Coin-Gruppen zusammen.
  // BTC-Anker dedupen: steht in fast jeder Gruppe, sonst zaehlt es zehnfach mit.
  const alle = [...new Map(
    buildBlocks().flatMap(b=>b.items).filter(r=>has(r.ticker)).map(r=>[r.ticker, r])
  ).values()];
  // Staerke am Abstand zum Jahreshoch messen ...
  const stark = alle.filter(r=>{ const d=has(r.ticker); return d.pct>=0.65 && d.offHigh!=null; });
  const leader = stark.filter(r=>has(r.ticker).offHigh>=NEAR_HIGH)
                      .sort((a,b)=> has(b.ticker).offHigh-has(a.ticker).offHigh);
  const ohneBasis = stark.filter(r=>has(r.ticker).offHigh<FAR_HIGH)
                      .sort((a,b)=> has(a.ticker).offHigh-has(b.ticker).offHigh);
  // ... und Schwaeche spiegelbildlich am Abstand ueber dem Jahrestief. Fehlt lo52, weil der
  // Cache aus einer aelteren Fassung stammt, bleiben die unteren Karten bis zum naechsten Lauf leer.
  const schwach = alle.filter(r=>{ const d=has(r.ticker); return d.pct<=0.35 && d.offLow!=null; });
  const amTief = schwach.filter(r=>has(r.ticker).offLow<=NEAR_LOW)
                      .sort((a,b)=> has(a.ticker).offLow-has(b.ticker).offLow);
  const abwaerts = schwach.filter(r=>has(r.ticker).offLow>FAR_LOW)
                      .sort((a,b)=> has(b.ticker).offLow-has(a.ticker).offLow);
  if(leader.length || ohneBasis.length || amTief.length || abwaerts.length){
    // Ohne die 52W-Spalte bleibt mehr Platz fuer den Gruppennamen. Welche Karte eine Gruppe
    // trifft, sagt die Karte selbst - die Zahl daneben war redundant.
    const zeile = r => { const d=has(r.ticker);
      return `<a class="ln" href="${chartURL(r.ticker)}"${tvTarget()}><b>${esc(r.ticker)}</b><i>${esc(r.name||'')}</i>`
           + `<u style="color:var(--dim)">${Math.round(d.pct*100)}%</u></a>`; };
    const kopf = `<div class="ln kopf"><b>Ticker</b><i></i><u>Monat</u></div>`;
    const karte = (kl, titel, spanne, liste) =>
      `<div class="dash-card ${kl}"><h5>${titel} <span>${spanne}</span></h5>${kopf}`
      + (liste.length ? liste.slice(0,8).map(zeile).join('') : '<div class="leer">keine</div>') + `</div>`;
    html += `<div class="dash-grp"><h4>Leader-Check <span style="color:var(--faint)">· Monats-RS ab 65 % bzw. bis 35 %</span></h4>
      <div class="dash-cols">
        ${karte('lead','Stark &amp; nahe Hoch', '&#8805; '+NEAR_HIGH+' %', leader)}
        ${karte('warn','Momentum Leaders', '&lt; '+FAR_HIGH+' %', ohneBasis)}
        ${karte('weak','Schwach &amp; nahe Tief', '&#8804; +'+NEAR_LOW+' %', amTief)}
        ${karte('down','Momentum Down Leaders', '&gt; +'+FAR_LOW+' %', abwaerts)}
      </div>
      <div class="dash-legend" style="padding:8px 0 0"><b>Monat</b> = RS-Perzentil über ${windowN} Tage.<br>
      <b>Stark &amp; nahe Hoch</b> hält sich seit einem Jahr · <b>Momentum Leaders</b> erholen sich weit unter dem Hoch.<br>
      <b>Schwach &amp; nahe Tief</b> ist bereits gebrochen · <b>Momentum Down Leaders</b> stehen noch weit über dem Tief — sie verlieren gerade erst.</div></div>`;
  }

  // ---------- Auf- und Absteiger ----------
  // Die Rangliste jedes vergangenen Tages laesst sich aus der gespeicherten Historie
  // nachrechnen: 260 Kalendertage liegen im Cache, das Fenster ist windowN lang. Kostet
  // daher keinen einzigen API-Abruf.
  const btcMapDash = buildBtcMap(dataMap);
  const standAt = (sym, zurueck) => {
    let full = refFullSeries(dataMap, sym, btcMapDash);
    if(!full) return null;
    if(lagDays>0) full = full.slice(0, -lagDays);
    if(zurueck>0) full = full.slice(0, -zurueck);
    if(full.length < windowN) return null;
    const w = full.slice(-windowN), basis = w[0];
    const rs = w.map(x=>x/basis);
    return {pct: percentRank(rs, rs.at(-1)), thrust: weightedThrust(rs)};
  };
  // Rangliste zum Stichtag, mit demselben Zweitkriterium wie die Liste: Thrust bei Gleichstand.
  const raengeAt = (rows, zurueck) => {
    const mit = rows.map(r=>({r, s: standAt(r.ticker, zurueck)})).filter(x=>x.s);
    mit.sort((a,b)=> (b.s.pct-a.s.pct) || ((b.s.thrust??-1)-(a.s.thrust??-1)));
    const m = new Map();
    mit.forEach((x,i)=> m.set(x.r.ticker, {rang:i+1, pct:x.s.pct}));
    return m;
  };
  if(alle.length >= 5){
    const jetzt = raengeAt(alle, 0);
    const bloecke = [{t:'Woche', zurueck:5}, {t:'Monat', zurueck:windowN}];
    const kopfM = `<div class="ln kopf"><b>Ticker</b><i></i><u>Rang</u><u>Plätze</u></div>`;
    let inhalt = '';
    bloecke.forEach(bl=>{
      const vorher = raengeAt(alle, bl.zurueck);
      const bewegt = alle
        .filter(r=> jetzt.has(r.ticker) && vorher.has(r.ticker))
        .map(r=>({r, jetzt: jetzt.get(r.ticker), vor: vorher.get(r.ticker)}))
        .map(x=>({...x, d: x.vor.rang - x.jetzt.rang}));
      if(!bewegt.length) return;
      // Aktueller Rang, alter in Klammern. Wie viele Plaetze es waren, steht rechts —
      // das ist die Zahl, nach der ausgewaehlt wird.
      const zeileM = x =>
        `<a class="ln" href="${chartURL(x.r.ticker)}"${tvTarget()}><b>${esc(x.r.ticker)}</b>`
        + `<i>${esc(x.r.name||'')}</i>`
        + `<u style="color:var(--ink)">${x.jetzt.rang} <span class="alt">(${x.vor.rang})</span></u>`
        + `<u style="color:${x.d>=0?'var(--up)':'var(--down)'}">${x.d>=0?'▲':'▼'}${Math.abs(x.d)}</u></a>`;
      // Ausgewaehlt wird nach der Groesse des Sprungs, angezeigt nach Rang: Aufsteiger mit
      // dem besten zuerst, Absteiger mit dem schwaechsten zuerst.
      const hoch = [...bewegt].filter(x=>x.d>0).sort((a,b)=> b.d-a.d).slice(0,8)
                              .sort((a,b)=> a.jetzt.rang-b.jetzt.rang);
      const runter = [...bewegt].filter(x=>x.d<0).sort((a,b)=> a.d-b.d).slice(0,8)
                              .sort((a,b)=> b.jetzt.rang-a.jetzt.rang);
      inhalt += `<div class="dash-card lead"><h5>Aufsteiger ${bl.t}</h5>${kopfM}`
             + (hoch.length ? hoch.map(zeileM).join('') : '<div class="leer">keine</div>') + `</div>`
             + `<div class="dash-card down"><h5>Absteiger ${bl.t}</h5>${kopfM}`
             + (runter.length ? runter.map(zeileM).join('') : '<div class="leer">keine</div>') + `</div>`;
    });
    if(inhalt){
      html += `<div class="dash-grp"><h4>Auf- und Absteiger <span style="color:var(--faint)">· Veränderung des Rangs</span></h4>
        <div class="dash-cols movers">${inhalt}</div>
        <div class="dash-legend" style="padding:8px 0 0">Aktueller Rang, in Klammern der von vor 5 bzw. ${windowN} Handelstagen. Rechts der Sprung in Plätzen.<br>
        Ausgewählt werden die grössten Sprünge, angezeigt nach Rang: Aufsteiger mit dem besten zuerst, Absteiger mit dem schwächsten. Steht es oben eng — viele Gruppen auf 100 % — kosten wenige RS-Punkte sofort viele Plätze.</div></div>`;
    }
  }
  visibleBlocks().forEach(bl=>{
    const items = bl.items.filter(r=>has(r.ticker));
    if(!items.length) return;
    html += `<div class="dash-grp"><h4>${esc(bl.label||'Ohne Gruppe')} <span style="color:var(--faint)">· ${items.length}</span></h4>`;

    // Farbstreifen, nach Monatsstärke sortiert
    const byPct = [...items].sort((a,b)=> (has(b.ticker).pct??-1)-(has(a.ticker).pct??-1));
    html += '<div class="strip">' + byPct.map(r=>{
      const d = has(r.ticker), c = stsColor(d.pct);
      const bg = c.bg==='transparent' ? '#151b26' : c.bg;
      return `<a href="${chartURL(r.ticker)}" target="_blank" rel="noopener" style="background:${bg};color:${c.fg}" title="${esc(r.ticker)}">${esc(r.ticker)}</a>`;
    }).join('') + '</div>';

    const line = (r, val, col) => {
      const d = has(r.ticker);
      return `<a class="ln" href="${chartURL(r.ticker)}" target="_blank" rel="noopener"><b>${esc(r.ticker)}</b><i>${esc(r.name||'')}</i><u style="color:${col(d)}">${val(d)}</u></a>`;
    };
    const sign = v => (v>=0?'+':'') + v.toFixed(1) + '%';
    const posCol = v => v==null?'var(--faint)':(v>=0?'var(--up)':'var(--down)');

    // Die drei Zeitebenen: Tag = RS-Rotation von gestern, Woche = Thrust, Monat = RS %
    const ebenen = [
      {t:'Monat',key:'pct',    txt:d=>d.pct==null?'—':Math.round(d.pct*100)+'%', col:d=>d.pct==null?'var(--faint)':(d.pct>=.65?'var(--up)':(d.pct<.3?'var(--down)':'var(--dim)'))},
      {t:'Woche',key:'thrust', txt:d=>d.thrust==null?'—':Math.round(d.thrust*100)+'%', col:d=>d.thrust==null?'var(--faint)':(d.thrust>=1?'var(--up)':'var(--down)')},
      sigmaDay
        ? {t:'Tag', key:'daySigma', txt:d=>d.daySigma==null?'—':(d.daySigma>=0?'+':'')+d.daySigma.toFixed(1)+'σ', col:d=>posCol(d.daySigma)}
        : {t:'Tag', key:'dayRS',    txt:d=>d.dayRS==null?'—':sign(d.dayRS),      col:d=>posCol(d.dayRS)}
    ];
    const n = Math.min(3, Math.floor(items.length/2)) || 1;
    html += '<div class="dash-cols">' + ebenen.map(e=>{
      const sorted = [...items].sort((a,b)=> (has(b.ticker)[e.key]??-Infinity)-(has(a.ticker)[e.key]??-Infinity));
      return `<div class="dash-card"><h5>${e.t} · stark</h5>${sorted.slice(0,n).map(r=>line(r,e.txt,e.col)).join('')}</div>
              <div class="dash-card"><h5>${e.t} · schwach</h5>${sorted.slice(-n).reverse().map(r=>line(r,e.txt,e.col)).join('')}</div>`;
    }).join('') + '</div></div>';
  });
  const stand = fmtDay((loadMeta()||{}).dataDate);
  html += `<div class="dash-legend">Streifen: nach Monats-RS, stärkster links.<br>
    <b>Tag</b> = RS-Veränderung am letzten Tag — misst Rotation, nicht Tagesperformance.<br>
    <b>Woche</b> = Thrust · <b>Monat</b> = RS-Perzentil über ${windowN} Handelstage.<br>
    Bezugstag ${stand}. Tippen öffnet den Chart.</div>`;
  $('#main').innerHTML = html || emptyState('tickers');
}

function render(dataMap){
  const main = $('#main');
  if(!localStorage.getItem(LS.key)){
    main.innerHTML = emptyState('setup'); return;
  }
  if(!ROWS.length){ main.innerHTML = emptyState('tickers'); return; }
  renderStatus(dataMap);
  $('#sortbar').style.display = viewMode==='dash' ? 'none' : '';
  if(viewMode==='dash'){ renderDash(dataMap); return; }

  let html = '';
  // BTC ist regulaeres Mitglied der Ticker-Liste (Gruppe "Referenz"), anders als der
  // Benchmark der Aktien-App keine separat gepinnte Zeile — es erscheint einfach als
  // normale Gruppe (im vs-BTC-Modus mit trivialer RS=100%, im vs-USD-Modus wie jeder Coin).
  const blocks = visibleBlocks();

  const val = (r)=>{
    const d = dataMap && dataMap[r.ticker];
    if(!d) return -Infinity;
    if(sortMode==='pct') return d.pct==null?-Infinity:d.pct;
    if(sortMode==='pct3m') return d.pct3m==null?-Infinity:d.pct3m;
    if(sortMode==='thrust') return d.thrust==null?-Infinity:d.thrust;
    if(sortMode==='dayrs'){
      const v = sigmaDay ? d.daySigma : d.dayRS;
      return v==null?-Infinity:v;
    }
    if(sortMode==='off52') return d.offHigh==null?-Infinity:d.offHigh;
    if(sortMode==='chg') return d.dayChg==null?-Infinity:d.dayChg;
    return 0;
  };
  // Bei "3 Monate" zeigt dieselbe Spalte wie "Monat" die 90-Tage- statt die windowN-Tage-
  // Perzentile — eigene Spalte haette das bewaehrte Zeilenraster (feste Spaltenbreiten)
  // gesprengt, die Wiederverwendung kostet dafuer keinen Layout-Umbau.
  const monatIstAktiv = sortMode==='pct' || sortMode==='pct3m';
  const colHead = `<div class="colhead"><span></span><span></span>`
    + `<span class="${sortMode==='thrust'?'hi':''}">RS Thrust</span>`
    + `<span class="${monatIstAktiv?'hi':''}">${sortMode==='pct3m'?'3 Monate':'Monat '+windowN+'T'}</span><span></span></div>`;
  // Im Gruppen-Reiter die Themenbloecke selbst nach Staerke ordnen, damit oben steht,
  // wo das Kapital liegt — statt alphabetisch oder in Eingabereihenfolge.
  let ordered = blocks;
  if(tabMode==='groups' && blocks.length>1){
    ordered = [...blocks].sort((a,b)=> blockStrength(b,dataMap)-blockStrength(a,dataMap));
  }
  ordered.forEach((bl,bi)=>{
    const zu = bl.label && collapsed.has(bl.label);
    if(bl.label){
      const nr = (tabMode==='groups' && ordered.length>1) ? `<span class="grank">${bi+1}</span>` : '';
      const st = blockStrength(bl, dataMap);
      const stTxt = st>=0 ? `<span class="gstr">Ø ${Math.round(st*100)}%</span>` : '';
      html += `<div class="group-head tappable" onclick="toggleGroup('${esc(bl.label).replace(/'/g,"\\'")}')">`
            + `${nr}<span class="caret${zu?'':' open'}">▾</span> ${esc(bl.label)}`
            + `${stTxt}<span class="gcount">${bl.items.length}</span></div>`;
      if(!zu) html += colHead;
    }
    if(zu) return;
    let items = bl.items;
    if(nearOnly){
      items = items.filter(r=>{ const d=dataMap&&dataMap[r.ticker]; return d && d.offHigh!=null && d.offHigh>=NEAR_HIGH; });
    }
    if(sortMode!=='orig'){
      // Zweitkriterium: Bei gleicher Monats-RS entscheidet der Thrust. Ohne das standen
      // die vielen 100-Prozent-Gruppen in willkuerlicher Reihenfolge. Sortiert man nach
      // Thrust, dreht sich das Paar um.
      const zweit = (r)=>{ const d = dataMap && dataMap[r.ticker]; if(!d) return -Infinity;
        return (sortMode==='thrust' ? d.pct : d.thrust) ?? -Infinity; };
      const ab = (x,y)=> x===y ? 0 : (y>x ? 1 : -1);          // absteigend, Infinity-sicher
      items = [...items].sort((a,c)=> ab(val(a),val(c)) || ab(zweit(a),zweit(c)));
    }
    items.forEach((r,i)=>{
      const d = dataMap && dataMap[r.ticker];
      html += rowHTML(r, d, i+1);
    });
  });
  main.innerHTML = html;
}
function rowHTML(r, d, rank){
  let spark='', sts='', thrCell='', chg='', chgCls='', barCol='transparent', metaLine='';
  const emptySpark = `<svg class="spark empty" viewBox="0 0 100 32"><line x1="0" y1="16" x2="100" y2="16" stroke="var(--line)" stroke-width="0.6"/></svg>`;
  if(d && d.rs && d.rs.length){
    spark = histogramSVG(d.rs);
    // Badge zeigt normalerweise die Monats-RS (windowN), bei aktivem "3 Monate"-Sort
    // stattdessen die 90-Tage-Perzentile — dieselbe Spalte, kein zusaetzliches Feld.
    const use3m = sortMode==='pct3m';
    const p = use3m ? d.pct3m : d.pct;
    const c = stsColor(p);
    sts = `<span class="sts${(sortMode==='pct'||use3m)?' hi':''}" style="background:${c.bg};color:${c.fg}">${p==null?'—':Math.round(p*100)+'%'}</span>`;
    if(p!=null){ barCol = p>=0.65?'var(--up)':(p<0.3?'var(--down)':'var(--faint)'); }
    // Die drei Kennzahlen als eigene Zeile ueber die volle Breite. Vorher standen sie in
    // der 84 px schmalen Ticker-Spalte und liefen dort unweigerlich ineinander.
    const zelle = (lab, wert, farbe, aktiv) =>
      `<span class="m${aktiv?' hi':''}"><i>${lab}</i><b style="color:${farbe}">${wert}</b></span>`;
    const teile = [];
    if(d.dayChg!=null)
      teile.push(zelle('Kurs', fmtChg(d.dayChg), d.dayChg>=0?'var(--up)':'var(--down)', sortMode==='chg'));
    if(d.dayRS!=null){
      const useSig = sigmaDay && d.daySigma!=null;
      const v = useSig ? d.daySigma : d.dayRS;
      teile.push(zelle('RS Tag', useSig ? (v>=0?'+':'')+v.toFixed(1)+'\u03c3' : fmtChg(v),
                       v>=0?'var(--up)':'var(--down)', sortMode==='dayrs'));
    }
    if(d.offHigh!=null){
      const farbe = d.offHigh>=NEAR_HIGH ? 'var(--up)' : (d.offHigh>=FAR_HIGH ? 'var(--dim)' : 'var(--down)');
      teile.push(zelle('52W-Hoch', Math.round(d.offHigh)+'%', farbe, sortMode==='off52'));
    }
    chg = teile.join('');
    const t = thrColor(d.thrust);
    thrCell = `<span class="thr${sortMode==='thrust'?' hi':''}" style="background:${t.bg};color:${t.fg}">${d.thrust==null?'—':Math.round(d.thrust*100)+'%'}</span>`;
    metaLine = '';
  } else {
    spark = emptySpark;
    sts = `<span class="sts" style="color:var(--faint)">·</span>`;
    thrCell = `<span class="thr" style="color:var(--faint)">·</span>`;
    metaLine = `<span class="meta"><span class="lab" style="color:var(--faint)">—</span></span>`;
  }
  // Echtes <a> statt Button: nur eine direkte Nutzer-Antippen-Navigation loest unter iOS
  // Universal Links aus. Ein per JavaScript geoeffneter Link landet immer im eingebetteten
  // Safari, und der reicht nicht an die installierte App weiter.
  const tvIcon = `<a class="tvbtn" href="${chartURL(r.ticker)}"${tvTarget()} aria-label="Chart ${esc(r.ticker)}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="4 14 9 9 13 13 20 6"/><polyline points="15 6 20 6 20 11"/></svg></a>`;
  const nm = `<span class="nm">${esc(r.name||'')}</span>`;
  // Coins mit hinterlegten verwandten Tickern lassen sich aufklappen
  const hasHold = HOLD[r.ticker];
  const caret = hasHold ? `<span class="caret${expanded.has(r.ticker)?' open':''}">▾</span>` : '';
  const tkAttr = hasHold ? ` role="button" tabindex="0" onclick="toggleHold('${esc(r.ticker)}',event)"` : '';
  return `<div class="row">
    <span class="rank-badge" style="background:${barCol}"></span>
    <span class="tk${hasHold?' tappable':''}"${tkAttr}>${rank?`<span class="rnk">${rank}</span>`:''}${esc(r.ticker)}${caret}${nm}${metaLine}</span>
    ${spark}
    ${thrCell}
    ${sts}
    <span class="col4">${tvIcon}</span>
    ${chg ? `<span class="metrics">${chg}</span>` : ''}
  </div>${holdingsHTML(r.ticker)}`;
}
function fmtChg(v){ if(v==null||isNaN(v)) return ''; const s=v>=0?'+':''; return s+v.toFixed(1)+'%'; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// TradingView-Chart öffnen.
// window.open('https://…') landet aus einer installierten PWA heraus immer im Safari-Sheet,
// weil Universal Links dort nicht greifen. Darum zuerst das App-Schema versuchen und erst
// nach kurzer Wartezeit auf die Website zurückfallen, falls die App nicht reagiert hat.
// Krypto-Symbol fuer TradingView: BINANCE:<TICKER>USDT. Annahme (nicht aus echten
// Notierungen geprueft wie bei der Aktien-App): alle Coins der Standardliste haben ein
// USDT-Paar auf Binance — bei den grossen/mittleren Caps hier praktisch immer der Fall.
// Fehlt ein Paar, meldet TradingView "invalid symbol"; betrifft am ehesten sehr neue Token.
function tvSymbol(t){
  return 'BINANCE:' + t.toUpperCase() + 'USDT';
}
// Eine installierte Web-App oeffnet JEDE https-Adresse im eingebetteten Safari, egal ob
// mit oder ohne neuen Tab — deshalb kam bisher immer die Website. Ein eigenes URL-Schema
// ist dagegen keine Webadresse und wird von iOS direkt an die App uebergeben.
// TradingView dokumentiert kein eigenes URL-Schema; die Apps fangen stattdessen normale
// tradingview.com-Links ab (Universal Links). Deshalb oeffnen die tradingview://-Varianten
// zwar die App, verstehen aber kein Symbol. Der Umweg: x-safari-https:// zwingt iOS, den
// Link in Safari selbst zu oeffnen statt im eingebetteten Browser der Web-App — und dort
// greift der Universal Link und uebergibt an die App.
const CHART_SRC = {
  tv:   t => 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(tvSymbol(t)),
  tvpl: t => 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(t)
};
function chartURL(ticker){
  const url = (CHART_SRC[chartSrc] || CHART_SRC.tv)(ticker);
  // x-safari-https:// zwingt iOS, den Link in der Safari-App zu oeffnen. Das zeigt zwar
  // das eigene, angemeldete Layout, legt aber bei jedem Antippen einen neuen Tab an.
  return esc(chartOpen==='safari' ? url.replace(/^https:/, 'x-safari-https:') : url);
}
// target="_blank" oeffnet aus einer installierten PWA heraus den eingebetteten Safari,
// und der reicht Universal Links NICHT an die installierte App weiter — genau deshalb
// landete man auf der mobilen Website. Ohne target uebernimmt iOS die App.
// Ein *benannter* Zielrahmen statt _blank: Jeder weitere Chart landet in derselben
// Ansicht statt in einem neuen Tab. Beim x-safari-Weg greift das nicht, dort entscheidet
// die Safari-App selbst — deshalb dort der Tab-Wildwuchs.
function tvTarget(){ return chartOpen==='safari' ? '' : ' target="tvchart" rel="noopener"'; }
// Namen + Kennzahlen als Popover zeigen (Tap auf Ticker)

}
